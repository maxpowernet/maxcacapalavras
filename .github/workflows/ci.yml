name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # eslint-plugin-jsx-a11y e o Testing Library ainda declaram peer de
      # ESLint 9; o projeto usa a 10. Funcionam normalmente, mas o npm precisa
      # da flag para instalar.
      - name: Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Checagem de tipos (JSDoc)
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
